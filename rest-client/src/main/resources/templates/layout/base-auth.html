<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - Sistema de Fichajes">Sistema de Fichajes</title>
    <link rel="icon" type="image/png" href="/favicon-32.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:inline="javascript">
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark-mode");
      } catch (e) {}
    </script>
</head>
<body>

    <button type="button" class="theme-toggle theme-toggle-fixed" aria-pressed="false" title="Cambiar a tema oscuro">
        <span class="theme-toggle-icon">🌙</span>
    </button>

    <div layout:fragment="content">
        <!-- aquí se inserta el contenido de cada página (login, register...) -->
    </div>

    <script th:src="@{/js/theme.js}"></script>

</body>
</html>
