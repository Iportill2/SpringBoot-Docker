<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:inline="javascript">
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {}
    </script>
</head>
<body>

    <button type="button" class="theme-toggle theme-toggle-fixed" aria-pressed="false" title="Cambiar a tema oscuro">
        <span class="theme-toggle-icon">🌙</span>
    </button>

    <header class="app-header">
        <img th:src="@{/img/logo.png}" alt="Logo" class="logo-header">
        <h1>Nombre Empresa</h1>
    </header>

    <div class="error-wrapper">
        <main layout:fragment="content"></main>

        <footer class="app-footer">
            <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Tu Empresa - Sistema de Fichajes</p>
        </footer>
    </div>

    <script th:src="@{/js/theme.js}"></script>

</body>
</html>
