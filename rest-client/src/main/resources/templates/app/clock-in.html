<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base-app}">

<body>
	<div layout:fragment="content">
		<div class="clockin-page">
			<h2>Hola, <span th:text="${username}"></span></h2>
			<p>¿Comenzamos jornada?</p>

			<div class="clockin-times">
				<p th:if="${startTime}">
					Inicio: <span th:text="${startTime}"></span>
				</p>
				<p th:if="${pauseTime}">
					Pausa: <span th:text="${pauseTime}"></span>
				</p>
				<p th:if="${resumeTime}">
					Reanudado: <span th:text="${resumeTime}"></span>
				</p>
				<p th:if="${endTime}">Fin: <span th:text="${endTime}"></span></p>
			</div>
			<div class="clockin-actions">
				<form th:if="${(startTime == null or endTime != null) and finishedToday != true}"
					th:action="@{/menu/clock-in/start}" method="post"
					data-confirm="¿Quieres iniciar la jornada?">
					<button type="submit" class="btn-start">Iniciar jornada</button>
				</form>

				<form th:if="${startTime != null and endTime == null and breakOpen != true}"
					th:action="@{/menu/clock-in/pause}" method="post"
					data-confirm="¿Quieres pausar la jornada?">
					<button type="submit" class="btn-pause">Pausar</button>
				</form>

				<form th:if="${breakOpen == true}" th:action="@{/menu/clock-in/resume}" method="post">
					<button type="submit" class="btn-pause">Reanudar</button>
				</form>

				<form th:if="${startTime != null and endTime == null}" th:action="@{/menu/clock-in/stop}" method="post"
					data-confirm="¿Quieres terminar la jornada?" data-danger="true">
					<button type="submit" class="btn-stop">Terminar jornada</button>
				</form>
				<p th:if="${finishedToday == true}" class="worked-summary">
					Ya has finalizado tu jornada de hoy. ¡Hasta mañana!
				</p>
			</div>
			</div>
	</div>
</body>

</html>
