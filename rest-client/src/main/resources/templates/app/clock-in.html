<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base-app}">

<body>
	<div layout:fragment="content">
		<div class="clockin-page">
			<h2>Hola, <span th:text="${username}"></span> 👋</h2>
			<p>¿Comenzamos jornada?</p>

			<div class="clockin-times">
				<p th:if="${horaInicio}">Inicio: <span th:text="${horaInicio}"></span></p>
				<p th:if="${horaPausa}">Pausa: <span th:text="${horaPausa}"></span></p>
				<p th:if="${horaFin}">Fin: <span th:text="${horaFin}"></span></p>
			</div>

			<div class="clockin-actions">
				<form th:action="@{/clock-in/start}" method="post">
					<button type="submit" class="btn-start">Iniciar jornada</button>
				</form>
				<form th:action="@{/clock-in/pause}" method="post">
					<button type="submit" class="btn-pause">Pausar</button>
				</form>
				<form th:action="@{/clock-in/stop}" method="post">
					<button type="submit" class="btn-stop">Parar jornada</button>
				</form>
			</div>
			<form th:action="@{/clock-in/reset}" method="post">
			    <button type="submit" class="btn-reset">Resetear horas</button>
			</form>
		</div>
	</div>
</body>

</html>
