<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base-app}">

<body>

    <div layout:fragment="content">

        <div class="admin-page">

            <h2 class="admin-title">
                Gestión de copias de seguridad
            </h2>


            <!-- Mensajes de restauración -->
            <div th:if="${message}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${popup}" class="toast" id="backupToast">
                <span th:text="${popup}"></span>
            </div>


            <div class="backup-actions">

                <form th:action="@{/menu/backups/create}" method="post">

                    <button type="submit" class="btn-db-upload">
                        Crear backup
                    </button>

                </form>

                <a th:href="@{/menu/backups/log/view}" class="btn-db-upload">
                    Ver log de auditoría
                </a>

                <form th:action="@{/menu/backups/cleanup}" method="post"
                    data-confirm="¿Aplicar la retención y eliminar los backups antiguos según la configuración?">
                    <button type="submit" class="btn-db-upload">
                        Aplicar retención
                    </button>
                </form>

            </div>


            <div class="crm-list-box">
                <h3 class="crm-section-title">Lista de Usuarios</h3>
                <table class="admin-table backup-table">


                    <thead>

                        <tr>
                            <th>Archivo</th>
                            <th>Tamaño</th>
                            <th>Fecha de creación</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>


                    <tbody id="backupTbody">

                        <tr th:each="backup : ${backups}">

                            <td th:text="${backup.fileName}">
                                archivo.sql.gz
                            </td>

                            <td th:text="${backup.size >= 1048576
                              ? #numbers.formatDecimal(backup.size / 1048576.0, 1, 2) + ' MB'
                              : #numbers.formatDecimal(backup.size / 1024.0, 1, 2) + ' KB'}">
                                0 KB
                            </td>

                            <td th:text="${#temporals.format(backup.created, 'yyyy/MM/dd HH:mm:ss')}">
                                2026/08/12 10:00:00
                            </td>

                            <td>
                                <div class="backup-actions-table">

                                    <div class="backup-actions-group">

                                        <a class="btn-approve"
                                            th:href="@{/menu/backups/download/{file}(file=${backup.fileName})}">
                                            Descargar
                                        </a>

                                        <form th:action="@{/menu/backups/restore/{file}(file=${backup.fileName})}"
                                            method="post"
                                            data-confirm="¿Seguro que quieres restaurar esta copia? Se reemplazarán los datos actuales.">

                                            <button type="submit" class="btn-db-download">
                                                Restaurar
                                            </button>
                                        </form>
                                    </div>

                                    <form th:action="@{/menu/backups/delete/{file}(file=${backup.fileName})}"
                                        method="post"
                                        data-confirm="¿Seguro que quieres eliminar este backup? Esta acción no se puede deshacer."
                                        data-danger="true">

                                        <button type="submit" class="btn-db-delete">
                                            Eliminar
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(backups)}">
                            <td colspan="4" class="crm-empty">No hay copias de seguridad</td>
                        </tr>

                    </tbody>
                </table>

                <!-- PAGINACIÓN -->
                <div class="pagination-controls" id="paginacionBackups"></div>
            </div>
        </div>
    </div>


    <script>
        (function () {

            var toast = document.getElementById('backupToast');

            if (toast) {

                requestAnimationFrame(function () {
                    toast.classList.add('show');
                });

                setTimeout(function () {
                    toast.classList.remove('show');
                }, 3000);
            }

            /* ---------- PAGINACIÓN (genérica, 10 por página) ---------- */
            function crearPaginador(config) {
                var paginaActual = 1;
                var porPagina = 10;

                function render() {
                    var totalPaginas = Math.max(1, Math.ceil(config.rows.length / porPagina));

                    if (paginaActual > totalPaginas) paginaActual = totalPaginas;

                    config.rows.forEach(function (r, i) {
                        var enPagina = i >= (paginaActual - 1) * porPagina && i < paginaActual * porPagina;
                        r.style.display = enPagina ? '' : 'none';
                    });

                    pintarControles(totalPaginas);
                }

                function pintarControles(totalPaginas) {
                    var cont = document.getElementById(config.controlsId);
                    if (!cont) return;
                    cont.innerHTML = '';

                    if (totalPaginas <= 1) return;

                    var btnPrev = document.createElement('button');
                    btnPrev.type = 'button';
                    btnPrev.textContent = '‹ Anterior';
                    btnPrev.disabled = paginaActual === 1;
                    btnPrev.addEventListener('click', function () {
                        paginaActual--;
                        render();
                    });
                    cont.appendChild(btnPrev);

                    var info = document.createElement('span');
                    info.textContent = ' Página ' + paginaActual + ' de ' + totalPaginas + ' ';
                    cont.appendChild(info);

                    var btnNext = document.createElement('button');
                    btnNext.type = 'button';
                    btnNext.textContent = 'Siguiente ›';
                    btnNext.disabled = paginaActual === totalPaginas;
                    btnNext.addEventListener('click', function () {
                        paginaActual++;
                        render();
                    });
                    cont.appendChild(btnNext);
                }

                return { render: render };
            }

            var backupRows = Array.from(document.querySelectorAll('#backupTbody tr'));
            var paginadorBackups = crearPaginador({ rows: backupRows, controlsId: 'paginacionBackups' });
            paginadorBackups.render();

        })();
    </script>

    </div>

</body>

</html>
