<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base-app}">

<body>
    <div layout:fragment="content">
        <div class="crm-page-full">
            <h2 class="admin-title">Mi perfil</h2>

            <div class="profile-card">
                <div th:each="uq : ${userQuestions}" class="profile-field profile-question">
                    <button type="button" class="btn-reveal-question">Mostrar pregunta</button>
                    <span class="profile-label" th:text="${uq.questionText}" hidden></span>
                    <span class="profile-value" th:text="${uq.answer}" hidden></span>
                </div>

                <div class="profile-field">
                    <span class="profile-label">Usuario</span>
                    <span class="profile-value" th:text="${user.username}"></span>
                </div>

                <div class="profile-field">
                    <span class="profile-label">Email</span>
                    <span class="profile-value-wrapper">
                        <span class="profile-value" id="emailValue" th:attr="data-email=${user.email}">••••••••</span>
                        <button type="button" id="toggleEmailBtn" class="btn-toggle-email">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </span>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const emailValue = document.getElementById('emailValue');
                const toggleBtn = document.getElementById('toggleEmailBtn');
                const eyeIcon = document.getElementById('eyeIcon');
                const realEmail = emailValue.getAttribute('data-email');
                let hidden = true;

                const eyeOpenPath = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
                const eyeClosedPath = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

                function mask(email) {
                    const [user, domain] = email.split('@');
                    return '•'.repeat(user.length) + '@' + domain;
                }

                emailValue.textContent = mask(realEmail);

                toggleBtn.addEventListener('click', function () {
                    hidden = !hidden;
                    emailValue.textContent = hidden ? mask(realEmail) : realEmail;
                    eyeIcon.innerHTML = hidden ? eyeOpenPath : eyeClosedPath;
                });

                document.querySelectorAll('.btn-reveal-question').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var field = btn.closest('.profile-field');
                        var label = field.querySelector('.profile-label');
                        var value = field.querySelector('.profile-value');
                        var oculto = label.hidden;
                        label.hidden = !oculto;
                        value.hidden = !oculto;
                        btn.textContent = oculto ? 'Ocultar pregunta' : 'Mostrar pregunta';
                    });
                });
            });
        </script>
    </div>

</body>

</html>
