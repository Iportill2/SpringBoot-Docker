<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base-app}">

<body>
    <div layout:fragment="content">
        <div class="profile-page">
            <div class="profile-card">
                <h2>Mi perfil</h2>

                <div th:each="uq : ${userQuestions}" class="profile-field">
                    <span class="profile-label" th:text="${uq.questionText}"></span>
                    <span class="profile-value" th:text="${uq.answer}"></span>
                </div>


                <div class="profile-field">
                    <span class="profile-label">Usuario</span>
                    <span class="profile-value" th:text="${user.username}"></span>
                </div>

                <div class="profile-field">
                    <span class="profile-label">Email</span>
                    <span class="profile-value-wrapper">
                        <span class="profile-value" id="emailValue" th:attr="data-email=${user.email}">••••••••</span>
                        <button type="button" id="toggleEmailBtn" class="btn-toggle-email">👁️</button>
                    </span>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout-profile">Cerrar sesión</button>
                </form>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const emailValue = document.getElementById('emailValue');
                const toggleBtn = document.getElementById('toggleEmailBtn');
                const realEmail = emailValue.getAttribute('data-email');
                let hidden = true;

                function mask(email) {
                    const [user, domain] = email.split('@');
                    return '•'.repeat(user.length) + '@' + domain;
                }

                emailValue.textContent = mask(realEmail);

                toggleBtn.addEventListener('click', function () {
                    hidden = !hidden;
                    emailValue.textContent = hidden ? mask(realEmail) : realEmail;
                    toggleBtn.textContent = hidden ? '👁️' : '👁️‍🗨️';
                });
            });
        </script>
    </div>

</body>

</html>
