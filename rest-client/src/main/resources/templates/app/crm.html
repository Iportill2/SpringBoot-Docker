<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base-app}"
>
  <body>
    <div layout:fragment="content">
      <div class="crm-page-full">
        <h2 class="admin-title">CRM Tareas</h2>

        <div
          th:if="${message}"
          class="flash-message"
          th:text="${message}"
        ></div>
        <div
          th:if="${error}"
          class="flash-message flash-error"
          th:text="${error}"
        ></div>

        <div class="crm-layout">
          <section class="crm-form-section" th:if="${isAdmin}">
            <h3 class="crm-section-title">Nueva tarea</h3>
            <form
              th:action="@{/menu/crm/crear}"
              th:object="${tareaForm}"
              method="post"
              class="crm-form"
            >
              <label>
                Título
                <input
                  type="text"
                  th:field="*{titulo}"
                  required
                />
              </label>

              <label>
                Descripción
                <textarea
                  th:field="*{descripcion}"
                  rows="3"
                ></textarea>
              </label>

              <label>
                Cliente
                <select th:field="*{cliente.id}">
                  <option value="">Sin cliente</option>
                  <option
                    th:each="c : ${clientes}"
                    th:value="${c.id}"
                    th:text="${c.nombre}"
                  ></option>
                </select>
              </label>

              <label>
                Responsable
                <select
                  th:field="*{responsable.id}"
                  th:disabled="${!isAdmin}"
                >
                  <option th:if="${!isAdmin}" th:value="${session.userId}"></option>
                  <option value="">Sin responsable</option>
                  <option
                    th:each="u : ${usuarios}"
                    th:value="${u.id}"
                    th:text="${u.username}"
                  ></option>
                </select>
              </label>

              <label>
                Estado
                <select th:field="*{estado}">
                  <option value="PENDIENTE">Pendiente</option>
                  <option value="EN_CURSO">En curso</option>
                  <option value="COMPLETADA">Completada</option>
                </select>
              </label>

              <label>
                Prioridad
                <select th:field="*{prioridad}">
                  <option value="ALTA">Alta</option>
                  <option value="MEDIA">Media</option>
                  <option value="BAJA">Baja</option>
                </select>
              </label>

              <label>
                Fecha límite
                <input type="date" th:field="*{fechaLimite}" />
              </label>

              <label>
                Horas empleadas
                <input type="number" step="0.5" min="0" th:field="*{horasEmpleadas}" />
              </label>

              <button type="submit" class="btn-create">Crear tarea</button>
            </form>
          </section>

          <section class="crm-table-section">
            <h3 class="crm-section-title">Lista de tareas</h3>

            <table class="admin-table crm-table">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Cliente</th>
                  <th>Responsable</th>
                  <th>Estado</th>
                  <th>Prioridad</th>
                  <th>Fecha límite</th>
                  <th>Horas</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  th:each="t : ${tareas}"
                  th:with="estadoClass=${t.estado == 'COMPLETADA'} ? 'badge-active' : (${t.estado == 'EN_CURSO'} ? 'badge-user' : 'badge-blocked')"
                >
                  <td th:text="${t.titulo}"></td>
                  <td th:text="${t.cliente != null} ? ${t.cliente.nombre} : '—'"></td>
                  <td th:text="${t.responsable != null} ? ${t.responsable.username} : '—'"></td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${estadoClass}"
                      th:text="${t.estado}"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${t.prioridad == 'ALTA'} ? 'badge-blocked' : 'badge-user'"
                      th:text="${t.prioridad}"
                    ></span>
                  </td>
                  <td th:text="${t.fechaLimite != null} ? ${#temporals.format(t.fechaLimite, 'dd/MM/yyyy')} : '—'"></td>
                  <td th:text="${t.horasEmpleadas != null} ? ${t.horasEmpleadas} : '—'"></td>
                  <td class="admin-actions">
                    <form
                      th:if="${isAdmin}"
                      th:action="@{/menu/crm/eliminar/{id}(id=${t.id})}"
                      method="post"
                      data-confirm="¿Seguro que quieres eliminar esta tarea? Esta acción no se puede deshacer."
                      data-danger="true"
                    >
                      <button type="submit" class="btn-delete">Eliminar</button>
                    </form>

                    <form
                      th:if="${!isAdmin and t.responsable == null}"
                      th:action="@{/menu/crm/asignar/{id}(id=${t.id})}"
                      method="post"
                      data-confirm="¿Quieres asignarte esta tarea?"
                    >
                      <button type="submit" class="btn-approve">Asignarme</button>
                    </form>

                    <form
                      th:if="${!isAdmin and t.responsable != null and t.responsable.id == session.userId}"
                      th:action="@{/menu/crm/horas/{id}(id=${t.id})}"
                      method="post"
                      class="horas-form"
                    >
                      <input
                        type="number"
                        step="0.5"
                        min="0"
                        name="horasEmpleadas"
                        th:value="${t.horasEmpleadas}"
                      />
                      <button type="submit" class="btn-approve">Guardar horas</button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tareas)}">
                  <td colspan="8" class="crm-empty">No hay tareas</td>
                </tr>
              </tbody>
            </table>
          </section>
        </div>
      </div>

      <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
          <h3 class="modal-title" id="modalTitle">Confirmar acción</h3>
          <p class="modal-message" id="modalMessage">¿Seguro que quieres continuar?</p>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="modalCancel">Cancelar</button>
            <button type="button" class="btn-confirm" id="modalConfirm">Confirmar</button>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var overlay = document.getElementById('confirmModal');
          var message = document.getElementById('modalMessage');
          var confirmBtn = document.getElementById('modalConfirm');
          var cancelBtn = document.getElementById('modalCancel');
          var pendingForm = null;

          document.querySelectorAll('form[data-confirm]').forEach(function (form) {
            form.addEventListener('submit', function (event) {
              event.preventDefault();
              pendingForm = form;
              message.textContent = form.dataset.confirm;
              if (form.dataset.danger === 'true') {
                confirmBtn.classList.add('btn-confirm-danger');
              } else {
                confirmBtn.classList.remove('btn-confirm-danger');
              }
              overlay.classList.add('show');
            });
          });

          confirmBtn.addEventListener('click', function () {
            overlay.classList.remove('show');
            if (pendingForm) {
              pendingForm.submit();
            }
          });

          cancelBtn.addEventListener('click', function () {
            overlay.classList.remove('show');
          });

          overlay.addEventListener('click', function (event) {
            if (event.target === overlay) {
              overlay.classList.remove('show');
            }
          });
        })();
      </script>
    </div>
  </body>
</html>
