<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base-app}">

<body>
  <div layout:fragment="content">
    <div class="admin-page">
      <h2 class="admin-title">Gestión de usuarios</h2>

      <div class="admin-layout">
        <div style="width:100%;max-width:850px;">
          <!-- BARRA DE FILTROS -->
          <div class="crm-filters" id="adminFilters">
            <label>
              Buscar nombre
              <input type="text" id="filtroNombre" placeholder="Escribe para buscar…" />
            </label>
            <label>
              Rol
              <select id="filtroRol">
                <option value="">Todos</option>
              </select>
            </label>
            <button class="btn-clear-filters" id="btnLimpiar">✕ Limpiar</button>
          </div>

          <table class="admin-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="adminTbody">
              <tr th:each="u : ${users}" th:attr="
                data-username=${u.username != null ? u.username : ''},
                data-rol=${(u.role != null and u.role.name != 'PENDIENTE') ? u.role.name : 'PENDIENTE'}
              ">
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td>
                  <span class="badge badge-user" th:if="${u.role != null and u.role.name == 'EMPLEADO'}"
                    th:text="'EMPLEADO'">
                  </span>
                  <span class="badge badge-active" th:if="${u.role != null and u.role.name == 'ADMIN'}"
                    th:text="'ADMIN'">
                  </span>
                  <span class="badge badge-blocked" th:if="${u.role == null or u.role.name == 'PENDIENTE'}"
                    th:text="'PENDIENTE'">
                  </span>
                </td>
                <td class="admin-actions">
                  <form th:action="@{/menu/admin/approve/{id}(id=${u.id})}" method="post"
                    th:if="${u.role == null or u.role.name == 'PENDIENTE'}"
                    data-confirm="¿Confirmas que quieres aprobar a este usuario?">
                    <button type="submit" class="btn-approve">Aprobar</button>
                  </form>
                  <form th:action="@{/menu/admin/delete/{id}(id=${u.id})}" method="post"
                    data-confirm="¿Seguro que quieres eliminar este usuario? Esta acción no se puede deshacer."
                    data-danger="true">
                    <button type="submit" class="btn-delete">Eliminar</button>
                  </form>
                </td>
              </tr>
            </tbody>
            <tfoot>
              <tr id="noResultsRow" style="display:none;">
                <td colspan="4" class="crm-empty">No hay usuarios que coincidan con los filtros</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var rows = Array.from(document.querySelectorAll('#adminTbody tr'));
        var noResults = document.getElementById('noResultsRow');

        function poblarSelect(id, dataKey) {
          var select = document.getElementById(id);
          var presentes = rows
            .map(function (r) { return r.dataset[dataKey]; })
            .filter(Boolean);
          var valores = [...new Set([...presentes, 'EMPLEADO', 'ADMIN', 'PENDIENTE'])].sort();
          valores.forEach(function (v) {
            var opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            select.appendChild(opt);
          });
        }
        poblarSelect('filtroRol', 'rol');

        function filtrar() {
          var nombre = document.getElementById('filtroNombre').value.toLowerCase().trim();
          var rol = document.getElementById('filtroRol').value;

          var visibles = 0;
          rows.forEach(function (row) {
            var ok =
              (!nombre || (row.dataset.username || '').toLowerCase().includes(nombre)) &&
              (!rol || row.dataset.rol === rol);

            row.style.display = ok ? '' : 'none';
            if (ok) visibles++;
          });

          if (noResults) noResults.style.display = visibles === 0 ? '' : 'none';
        }

        document.getElementById('filtroNombre').addEventListener('input', filtrar);
        document.getElementById('filtroRol').addEventListener('change', filtrar);

        document.getElementById('btnLimpiar').addEventListener('click', function () {
          document.getElementById('filtroNombre').value = '';
          document.getElementById('filtroRol').value = '';
          filtrar();
        });
      })();
    </script>
  </div>
</body>

</html>
