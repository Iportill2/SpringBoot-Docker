<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base-app}">

<body>
  <div layout:fragment="content">
    <div class="admin-page">
      <h2 class="admin-title">Gestión de usuarios</h2>

      <div class="admin-layout">
        <div>
          <!-- BARRA DE FILTROS -->
          <div class="crm-filters" id="adminFilters">
            <h3 class="crm-section-title">Filtro de Usuarios</h3>
            <label>
              Buscar nombre
              <input type="text" id="filtroNombre" placeholder="Escribe para buscar…" />
            </label>
            <label>
              Rol
              <select id="filtroRol">
                <option value="">Todos</option>
              </select>
            </label>
            <button class="btn-clear-filters" id="btnLimpiar">✕ Limpiar</button>
          </div>

          <div class="crm-list-box">
            <h3 class="crm-section-title">Lista de Usuarios</h3>

            <table class="admin-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>

			<tbody id="adminTbody">
			              <tr th:each="u : ${users}" th:attr="
			                data-username=${u.username != null ? u.username : ''},
			                data-rol=${(u.role != null and u.role.name != 'PENDIENTE') ? u.role.name : 'PENDIENTE'}
			              ">
			                <td th:text="${#strings.abbreviate(u.username, 20)}"></td>
			                <td>
			                  <span class="badge badge-user" th:if="${u.role != null and u.role.name == 'EMPLEADO'}"
			                    th:text="'EMPLEADO'">
			                  </span>
			                  <span class="badge badge-active" th:if="${u.role != null and u.role.name == 'ADMIN'}"
			                    th:text="'ADMIN'">
			                  </span>
			                  <span class="badge badge-blocked" th:if="${u.role == null or u.role.name == 'PENDIENTE'}"
			                    th:text="'PENDIENTE'">
			                  </span>
			                  <span class="badge badge-blocked" th:if="${u.role != null and u.role.name == 'BLOQUEADO'}"
			                    th:text="'BLOQUEADO'">
			                  </span>
			                </td>
			                <td>
			                  <div class="admin-actions admin-actions--center">
			                    <form th:action="@{/menu/admin/approve/{id}(id=${u.id})}" method="post"
			                      th:if="${u.role == null or u.role.name == 'PENDIENTE'}"
			                      data-confirm="¿Confirmas que quieres aprobar a este usuario?">
			                      <button type="submit" class="btn-approve">Aprobar</button>
			                    </form>
			                    <form th:action="@{/menu/admin/reactivate/{id}(id=${u.id})}" method="post"
			                      th:if="${u.role != null and u.role.name == 'BLOQUEADO'}"
			                      data-confirm="¿Seguro que quieres reactivar a este usuario?">
			                      <button type="submit" class="btn-approve">Reactivar</button>
			                    </form>
			                    <form th:action="@{/menu/admin/block/{id}(id=${u.id})}" method="post"
			                      th:if="${u.role != null and u.role.name != 'BLOQUEADO' and u.role.name != 'PENDIENTE'}"
			                      data-confirm="¿Seguro que quieres bloquear a este usuario?"
			                      data-danger="true">
			                      <button type="submit" class="btn-delete">Bloquear</button>
			                    </form>
			                  </div>
			                </td>
			              </tr>
			            </tbody>
            <tfoot>
              <tr id="noResultsRow" style="display:none;">
                <td colspan="3" class="crm-empty">No hay usuarios que coincidan con los filtros</td>
              </tr>
            </tfoot>
          </table>

          <!-- PAGINACIÓN -->
          <div class="pagination-controls" id="paginacionUsuarios"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var rows = Array.from(document.querySelectorAll('#adminTbody tr'));
        var noResults = document.getElementById('noResultsRow');

        /* ---------- PAGINACIÓN (genérica, 10 por página) ---------- */
        function crearPaginador(config) {
          var paginaActual = 1;
          var porPagina = 10;

          function getFilasFiltradas() {
            return config.rows.filter(function (r) {
              return r.dataset.filtradoOculto !== 'true';
            });
          }

          function render() {
            var filtradas = getFilasFiltradas();
            var totalPaginas = Math.max(1, Math.ceil(filtradas.length / porPagina));

            if (paginaActual > totalPaginas) paginaActual = totalPaginas;

            filtradas.forEach(function (r, i) {
              var enPagina = i >= (paginaActual - 1) * porPagina && i < paginaActual * porPagina;
              r.style.display = enPagina ? '' : 'none';
            });

            config.rows.forEach(function (r) {
              if (r.dataset.filtradoOculto === 'true') r.style.display = 'none';
            });

            pintarControles(totalPaginas);
          }

          function pintarControles(totalPaginas) {
            var cont = document.getElementById(config.controlsId);
            if (!cont) return;
            cont.innerHTML = '';

            if (totalPaginas <= 1) return;

            var btnPrev = document.createElement('button');
            btnPrev.type = 'button';
            btnPrev.textContent = '‹ Anterior';
            btnPrev.disabled = paginaActual === 1;
            btnPrev.addEventListener('click', function () {
              paginaActual--;
              render();
            });
            cont.appendChild(btnPrev);

            var info = document.createElement('span');
            info.textContent = ' Página ' + paginaActual + ' de ' + totalPaginas + ' ';
            cont.appendChild(info);

            var btnNext = document.createElement('button');
            btnNext.type = 'button';
            btnNext.textContent = 'Siguiente ›';
            btnNext.disabled = paginaActual === totalPaginas;
            btnNext.addEventListener('click', function () {
              paginaActual++;
              render();
            });
            cont.appendChild(btnNext);
          }

          return {
            render: render,
            resetPagina: function () { paginaActual = 1; }
          };
        }

        var paginadorUsuarios = crearPaginador({ rows: rows, controlsId: 'paginacionUsuarios' });

        function poblarSelect(id, dataKey) {
          var select = document.getElementById(id);
          var presentes = rows
            .map(function (r) { return r.dataset[dataKey]; })
            .filter(Boolean);
          var valores = [...new Set([...presentes, 'EMPLEADO', 'ADMIN', 'PENDIENTE', 'BLOQUEADO'])].sort();
          valores.forEach(function (v) {
            var opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            select.appendChild(opt);
          });
        }
        poblarSelect('filtroRol', 'rol');

        function filtrar() {
          var nombre = document.getElementById('filtroNombre').value.toLowerCase().trim();
          var rol = document.getElementById('filtroRol').value;

          var visibles = 0;
          rows.forEach(function (row) {
            var ok =
              (!nombre || (row.dataset.username || '').toLowerCase().includes(nombre)) &&
              (!rol || row.dataset.rol === rol);

            row.dataset.filtradoOculto = ok ? 'false' : 'true';
            if (ok) visibles++;
          });

          if (noResults) noResults.style.display = visibles === 0 ? '' : 'none';

          paginadorUsuarios.resetPagina();
          paginadorUsuarios.render();
        }

        document.getElementById('filtroNombre').addEventListener('input', filtrar);
        document.getElementById('filtroRol').addEventListener('change', filtrar);

        document.getElementById('btnLimpiar').addEventListener('click', function () {
          document.getElementById('filtroNombre').value = '';
          document.getElementById('filtroRol').value = '';
          filtrar();
        });

        // Estado inicial: todas sin filtrar, paginadas desde el principio
        rows.forEach(function (row) {
          row.dataset.filtradoOculto = 'false';
        });
        paginadorUsuarios.render();
      })();
    </script>
  </div>
</body>

</html>
