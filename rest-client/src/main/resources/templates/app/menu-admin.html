<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base-app}"
>
  <body>
    <div layout:fragment="content">
      <div class="admin-page">
        <h2 class="admin-title">Gestión de usuarios</h2>

        <div class="admin-layout">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td>
                  <span
                    class="badge"
                    th:if="${u.role != null}"
                    th:classappend="${u.role.name == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                    th:text="${u.role.name}"
                  >
                  </span>
                  <span
                    class="badge badge-user"
                    th:if="${u.role == null}"
                    th:text="'Sin rol'"
                  >
                  </span>
                </td>
                <td class="admin-actions">
                  <form
                    th:action="@{/menu/admin/approve/{id}(id=${u.id})}"
                    method="post"
                  >
                    <button type="submit" class="btn-approve">Aprobar</button>
                  </form>
                  <form
                    th:action="@{/menu/admin/delete/{id}(id=${u.id})}"
                    method="post"
                  >
                    <button type="submit" class="btn-delete">Eliminar</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
