<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base-auth}">

<head>
	<title>Registro preguntas</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="auth-container">

			<div class="auth-branding">
				<h1>Empresa Empresa</h1>
				<p>¡¡¡Bienvenido!!!</p>
				<p>Completa las preguntas de seguridad</p>
			</div>


			<div class="auth-form">

				<form class="register-form" th:action="@{/register/questions}" th:object="${userQuestionsDTO}"
					method="post">

					<!-- ID del usuario creado en el paso 1 -->
					<input type="hidden" th:field="*{userId}">

					<div th:each="answer, stat : *{answers}">

						<select class="question-select" th:field="*{answers[__${stat.index}__].questionId}">
							<option value="">-- Selecciona una pregunta --</option>
							<option th:each="q : ${questions}" th:value="${q.id}" th:text="${q.text}">
							</option>
						</select>

						<input type="text" th:field="*{answers[__${stat.index}__].answer}"
							placeholder="Introduce tu respuesta">

						<span class="error" th:if="${#fields.hasErrors('answers[' + stat.index + '].answer')}"
							th:errors="*{answers[__${stat.index}__].answer}">
						</span>

					</div>

					<button type="submit">
						Finalizar
					</button>

				</form>

			</div>

		</div>
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const selects = document.querySelectorAll('.question-select');

				// Guardamos una copia de TODAS las opciones originales (una sola vez)
				const opcionesOriginales = Array.from(selects[0].querySelectorAll('option'));

				function updateOptions() {
					const selectedValues = Array.from(selects)
						.map(s => s.value)
						.filter(v => v !== '');

					selects.forEach(select => {
						const valorActual = select.value;

						// Reconstruimos el select desde cero con la lista original
						select.innerHTML = '';
						opcionesOriginales.forEach(original => {
							const esPlaceholder = original.value === '';
							const elegidaPorOtro = selectedValues.includes(original.value) && original.value !== valorActual;

							// Solo añadimos la opción si es el placeholder, o si nadie más la tiene elegida
							if (esPlaceholder || !elegidaPorOtro) {
								const opt = original.cloneNode(true);
								select.appendChild(opt);
							}
						});

						// Restauramos el valor que tenía este select
						select.value = valorActual;
					});
				}

				selects.forEach(select => select.addEventListener('change', updateOptions));

				updateOptions();
			});
		</script>

	</div>

</body>

</html>
