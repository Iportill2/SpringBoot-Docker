<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base-auth}">

<head>
	<title>Registro</title>
</head>

<body>

	<div layout:fragment="content">
		<div class="auth-container">
			<div class="auth-branding">
				<h1>Empresa Empresa</h1>
				<p>¡¡¡Bienvenido!!!</p>
				<p>Gracias por formar parte de este equipo</p>
			</div>
			<div class="auth-form">
				<form class="register-form" th:action="@{/register-2}" th:object="${questionDTO}" method="post">


<label for="answerOne">¿Cuál es tu color favorito?</label>
<input type="text" th:field="*{answerOne}" placeholder="">
<span class="error" th:if="${#fields.hasErrors('answerOne')}" th:errors="*{answerOne}"></span>

<label for="answerTwo">¿Cuál es el nombre de tu primera mascota?</label>
<input type="text" th:field="*{answerTwo}" placeholder="">
<span class="error" th:if="${#fields.hasErrors('answerTwo')}" th:errors="*{answerTwo}"></span>

<label for="answerThree">¿En qué ciudad vives?</label>
<input type="text" th:field="*{answerThree}" placeholder="">
<span class="error" th:if="${#fields.hasErrors('answerThree')}" th:errors="*{answerThree}"></span>

					<button type="submit">Registrarse</button>
					<a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
