services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db

    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend


  backup-service:
    build:
      context: ./backup-service

    container_name: backup-service

    ports:
      - "127.0.0.1:8082:8082"

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BACKUP_DIRECTORY: /backup
      BACKUP_CRON: ${BACKUP_CRON:-0 0 2 * * *}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION_ENABLED: ${BACKUP_RETENTION_ENABLED:-true}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
      BACKUP_SERVICE_USER: ${BACKUP_SERVICE_USER:-backup_service}
      BACKUP_SERVICE_PASSWORD: ${BACKUP_SERVICE_PASSWORD:-change_me_backup}
      TZ: ${TZ:-Europe/Madrid}

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - backups:/backup

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - backend


  api-rest:
    build:
      context: ./api-rest

    container_name: api-rest

    profiles:
      - full

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      TZ: ${TZ:-Europe/Madrid}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - backend


  rest-client:
    build:
      context: ./rest-client

    container_name: rest-client

    profiles:
      - full

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_SERVICE_USER: ${BACKUP_SERVICE_USER:-backup_service}
      BACKUP_SERVICE_PASSWORD: ${BACKUP_SERVICE_PASSWORD:-change_me_backup}

    depends_on:
      api-rest:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - backend


  nginx:
    build:
      context: ./nginx

    container_name: nginx

    profiles:
      - full

    ports:
      - "80:80"
      - "443:443"

    environment:
      SERVER_IP: ${SERVER_IP}

    depends_on:
      rest-client:
        condition: service_healthy

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - backend


volumes:

  mysql-data:

  backups:


networks:

  backend:
