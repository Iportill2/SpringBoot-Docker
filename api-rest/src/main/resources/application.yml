spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      buffered: false
      suffix: ""
      file-date-format: ""
      pattern: "%h %l %u %t \"%r\" %s %b"

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:14400000}
