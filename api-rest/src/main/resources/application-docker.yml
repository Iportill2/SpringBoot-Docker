spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:aplicacion}?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:api_user}
    password: ${MYSQL_PASSWORD:api_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health
