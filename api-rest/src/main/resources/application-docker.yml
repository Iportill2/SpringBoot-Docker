spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:aplicacion}?createDatabaseIfNotExist=true
    username: ${MYSQL_USER:api_user}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true

management:
  endpoints:
    web:
      exposure:
        include: health
