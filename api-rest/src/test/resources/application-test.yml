spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # Ejecuta el data-test.sql (propio de pruebas) en lugar del
      # data.sql de produccion. data-locations sustituye al script
      # por defecto, por lo que el data.sql real nunca se carga.
      mode: always
      data-locations: classpath:data-test.sql
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    # El data-test.sql se ejecuta DESPUES de que Hibernate cree el
    # esquema, garantizando que la tabla roles exista.
    defer-datasource-initialization: true

jwt:
  secret: claveSecretaSuficientementeLargaParaHs256ConAlmenos32Bytes
  expiration-ms: 86400000
