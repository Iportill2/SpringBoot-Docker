spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

server:
  port: 8082
  tomcat:
    accesslog:
      enabled: true
      directory: /backup
      prefix: access_log
      suffix: .log
      buffered: false
      pattern: "%h %l %u %t \"%r\" %s %b"

management:
  endpoints:
    web:
      exposure:
        include: health

backup:
  directory: ${BACKUP_DIRECTORY:/backup}
  cron: ${BACKUP_CRON:0 0 2 * * *}
  enabled: ${BACKUP_ENABLED:true}
  security:
    user: ${BACKUP_SERVICE_USER:backup_service}
    password: ${BACKUP_SERVICE_PASSWORD}
  retention:
    enabled: ${BACKUP_RETENTION_ENABLED:true}
    daily: ${BACKUP_RETENTION_DAILY:7}
    weekly: ${BACKUP_RETENTION_WEEKLY:4}
    monthly: ${BACKUP_RETENTION_MONTHLY:12}

mysql:
  host: ${MYSQL_HOST:mysql}
  port: ${MYSQL_PORT:3306}
  database: ${MYSQL_DATABASE:aplicacion}
  user: ${MYSQL_USER:api_user}
  password: ${MYSQL_PASSWORD:}